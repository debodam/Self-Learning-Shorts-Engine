# Check the channel for new long-form uploads, submit them to OpusClip, import finished clips, and score them.
# Manual trigger only for now. To schedule it, add a `schedule:` cron trigger.
# Keys come from repository secrets (see SETUP.md). Any integration whose secrets are
# missing uses mock data, and without the Supabase secrets the job runs as a dry run.
name: Weekly candidates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read everything, write nothing"
        type: boolean
        default: false

concurrency:
  group: weekly-candidates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPUSCLIP_API_KEY: ${{ secrets.OPUSCLIP_API_KEY }}
      OPUSCLIP_ORG_ID: ${{ secrets.OPUSCLIP_ORG_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run job:weekly-candidates
