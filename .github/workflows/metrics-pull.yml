# Pull views, likes, and comments for every Short on the Aced YouTube channel (MVP 2).
# Manual trigger only for now. To schedule it, add a `schedule:` cron trigger.
# Keys come from repository secrets (see SETUP.md). Any integration whose secrets are
# missing uses mock data, and without the Supabase secrets the job runs as a dry run.
name: Metrics pull

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read everything, write nothing"
        type: boolean
        default: false

concurrency:
  group: metrics-pull
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run job:metrics-pull
