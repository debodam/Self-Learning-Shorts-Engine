# Daily YouTube metrics pull (MVP 2): every Short on the Aced channel gets a views,
# likes, and comments snapshot, so views at 48 hours and 7 days get captured for new
# Shorts. Also links Shorts we posted and labels new Shorts' format with Claude Haiku.
# Keys come from repository secrets (see SETUP.md > Daily metrics pull).
#
# Scheduled runs require every secret: a missing one fails the run instead of falling
# back to a dry run. GitHub emails the repository's admins when a scheduled run fails.
name: Metrics pull

on:
  schedule:
    # 13:00 UTC is 8am or 9am Eastern, depending on daylight saving time.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read everything, write nothing"
        type: boolean
        default: false

concurrency:
  group: metrics-pull
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
      # Scheduled runs have no inputs, so they always require a live pull.
      REQUIRE_LIVE: ${{ inputs.dry_run != true }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      # Optional: without it, new Shorts wait for a label until the next pull with a key.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The job exits non-zero on any error, which fails the run.
      - run: npm run job:metrics-pull
