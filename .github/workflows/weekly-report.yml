# Weekly report (MVP 2 learning loop): measures how accurate the scoring agent's view
# predictions were, writes the week's learnings entry, proposes up to 3 changes to the
# scoring prompt, and backtests each one. Nothing changes until someone approves a
# proposal on the Learnings page. Keys come from repository secrets (see SETUP.md).
# Any error, including a missing secret, fails the run.
name: Weekly report

on:
  schedule:
    # Mondays at 14:00 UTC (9 or 10am Eastern), after the daily metrics pull.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      week_start:
        description: "Monday of the week to review (YYYY-MM-DD). Leave blank for last week."
        type: string
        required: false

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WEEK_START: ${{ inputs.week_start }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Exits non-zero on any error, which fails the run.
      - run: npm run job:weekly-report
